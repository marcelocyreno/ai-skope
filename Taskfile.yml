# AI Skope — everything you need to build, test and run the two halves.
#
#   task            list the targets
#   task up         build both halves, start the server, print a pairing code
#   task test       everything that does not cost tokens
version: "3"

vars:
  SERVER: "{{.TASKFILE_DIR}}/server"
  EXT: "{{.TASKFILE_DIR}}/extension"
  DESIGN: "{{.TASKFILE_DIR}}/design"
  AISS: "{{.TASKFILE_DIR}}/server/aiss"

tasks:
  default:
    desc: List the available tasks
    silent: true
    cmds:
      - task --list

  # ---------------------------------------------------------------- build ---

  build:
    desc: Build the server and the extension
    deps: [build:server, build:extension]

  build:server:
    desc: Build the aiss binary
    dir: "{{.SERVER}}"
    sources: ["**/*.go", "go.mod", "go.sum"]
    generates: ["aiss"]
    cmds:
      - make build

  build:extension:
    desc: Build the unpacked extension into extension/dist
    dir: "{{.EXT}}"
    cmds:
      - "[ -d node_modules ] || npm install"
      - npm run build

  build:design:
    desc: Rebuild the design kit and the interactive prototype
    dir: "{{.DESIGN}}"
    cmds:
      - node build.mjs

  install:
    desc: Install aiss onto your PATH (go install)
    dir: "{{.SERVER}}"
    cmds:
      - make install

  # ------------------------------------------------------------- run/stop ---

  up:
    desc: Build everything, start the server, and print a pairing code
    deps: [build]
    cmds:
      - task: start
      - task: pair

  start:
    desc: Start the server in the background
    cmds:
      - "{{.AISS}} start"

  serve:
    desc: Run the server in the foreground with debug logging (holds this terminal — pair from another)
    dir: "{{.SERVER}}"
    cmds:
      - make run

  stop:
    desc: Stop the server
    cmds:
      - "{{.AISS}} stop"

  restart:
    desc: Rebuild the server and restart it
    cmds:
      - "{{.AISS}} stop || true"
      - task: build:server
      - "{{.AISS}} start"

  status:
    desc: Is the server running, and what does it see
    cmds:
      - "{{.AISS}} status"

  doctor:
    desc: Check the installation and explain what to fix
    cmds:
      - "{{.AISS}} doctor"

  pair:
    desc: Print a one-time pairing code for the browser
    cmds:
      - "{{.AISS}} pair"

  logs:
    desc: Follow the server log
    cmds:
      - "{{.AISS}} logs -f"

  folder:
    desc: 'Allow a folder: task folder -- ~/dev'
    cmds:
      - "{{.AISS}} folders add {{.CLI_ARGS}} --watch"

  models:
    desc: List the models the switcher offers
    cmds:
      - "{{.AISS}} models"

  runtimes:
    desc: Detect the coding agents installed on this machine
    cmds:
      - "{{.AISS}} runtimes detect"

  # -------------------------------------------------------------- browsers ---

  brave:
    desc: 'Open brave://extensions with the dist path copied, ready for Load unpacked'
    deps: [build:extension]
    silent: true
    cmds:
      - printf '%s' "{{.EXT}}/dist" | pbcopy
      - |
        "/Applications/Brave Browser.app/Contents/MacOS/Brave Browser" "brave://extensions/" >/dev/null 2>&1 &
      - |
        echo
        echo "The path is on your clipboard:"
        echo "  {{.EXT}}/dist"
        echo
        echo "In the tab that just opened:"
        echo "  1. turn on Developer mode (top right)"
        echo "  2. Load unpacked"
        echo "  3. paste the path (⌘⇧G in the file dialog, then ⌘V)"
        echo
        echo "That install persists. After a rebuild, press Reload on the card."

  brave:test:
    desc: 'Start Brave with the extension loaded and paired, on its own profile'
    deps: [build:extension]
    cmds:
      - "{{.AISS}} status >/dev/null 2>&1 || {{.AISS}} start"
      - "{{.AISS}} pair | head -1 | awk '{print $3}' > /tmp/skope-pair-code"
      - cd "{{.EXT}}" && node tools/launch-brave.mjs

  brave:flag:
    desc: 'Restart Brave with the extension loaded (no clicks, but only for this launch)'
    deps: [build:extension]
    prompt: This quits Brave and reopens it. Unsaved tabs restore only if Brave is set to continue where you left off. Continue?
    cmds:
      - osascript -e 'tell application "Brave Browser" to quit' || true
      - sleep 2
      # Only --load-extension: --disable-extensions-except would switch off
      # every other extension in the profile.
      - |
        "/Applications/Brave Browser.app/Contents/MacOS/Brave Browser" --load-extension="{{.EXT}}/dist" >/dev/null 2>&1 &
      - sleep 2
      - echo "Brave restarted with AI Skope loaded (for this launch)."

  # ----------------------------------------------------------------- test ---

  test:
    desc: Every test that costs nothing (server, extension, both end to end)
    cmds:
      - task: test:server
      - task: test:extension
      - task: e2e:server
      - task: e2e:extension

  test:server:
    desc: Server unit and integration tests
    dir: "{{.SERVER}}"
    cmds:
      - go test ./...

  test:extension:
    desc: Extension unit tests and typecheck
    dir: "{{.EXT}}"
    cmds:
      - "[ -d node_modules ] || npm install"
      - npx vue-tsc --noEmit
      - npx vitest run

  race:
    desc: Server tests under the race detector
    dir: "{{.SERVER}}"
    cmds:
      - go test -race ./...

  e2e:server:
    desc: End to end against a real server with a fake agent (no network)
    dir: "{{.SERVER}}"
    cmds:
      - ./scripts/e2e.sh

  e2e:extension:
    desc: End to end in a real browser against a real server
    deps: [build:extension]
    dir: "{{.EXT}}"
    cmds:
      - npx playwright test

  # These call real models: they need the agent installed and authenticated,
  # and they cost tokens.
  real:
    desc: Drive every installed agent through a real turn (costs tokens)
    cmds:
      - task: real:claude
      - task: real:codex
      - task: real:pi
      - task: real:omp
      - task: real:opencode

  real:claude:
    desc: A real turn through Claude Code with Sonnet (costs tokens)
    dir: "{{.SERVER}}"
    cmds:
      - ./scripts/real-agent.sh claude-code sonnet "" low

  real:codex:
    desc: A real turn through Codex (costs tokens)
    dir: "{{.SERVER}}"
    cmds:
      - ./scripts/real-agent.sh codex {{.CODEX_MODEL | default "gpt-5.5"}} "" low

  real:pi:
    desc: A real turn through pi with z.ai GLM 5.3 Flash (costs tokens)
    dir: "{{.SERVER}}"
    cmds:
      - ./scripts/real-agent.sh pi glm-5.3-flash zai low

  real:omp:
    desc: A real turn through omp with z.ai GLM 5.3 Flash (costs tokens)
    dir: "{{.SERVER}}"
    cmds:
      - ./scripts/real-agent.sh omp glm-5.3-flash zai low

  real:opencode:
    desc: A real turn through opencode with GLM 5.3 (costs tokens)
    dir: "{{.SERVER}}"
    cmds:
      - ./scripts/real-agent.sh opencode glm-5.3 zai-coding-plan

  # ------------------------------------------------------------- housekeep ---

  fmt:
    desc: Format the Go source
    dir: "{{.SERVER}}"
    cmds:
      - gofmt -w .

  vet:
    desc: go vet
    dir: "{{.SERVER}}"
    cmds:
      - go vet ./...

  store:package:
    desc: 'Build the zip to upload to the Chrome Web Store'
    deps: [build:extension]
    silent: true
    cmds:
      - mkdir -p "{{.TASKFILE_DIR}}/store"
      - |
        v=$(python3 -c 'import json;print(json.load(open("{{.EXT}}/manifest.json"))["version"])')
        out="{{.TASKFILE_DIR}}/store/ai-skope-$v.zip"
        rm -f "$out"
        # The store wants the *contents* of dist, manifest at the root.
        cd "{{.EXT}}/dist" && zip -qr "$out" . -x '.*' -x '__MACOSX/*'
        echo "$out"
        unzip -l "$out" | tail -3
      - |
        echo
        echo "Next: store/LISTING.md has every field the dashboard asks for."

  store:shots:
    desc: 'Capture the store screenshots (SKOPE_SHOT_RUNTIME=<id> to use a real agent)'
    deps: [build:extension]
    dir: "{{.EXT}}"
    cmds:
      - npx playwright test --config=playwright.store.config.ts

  release:
    desc: 'Cut a release from a tag that is already pushed (needs goreleaser)'
    silent: true
    cmds:
      - |
        if [ -z "$(git tag --points-at HEAD)" ]; then
          echo "HEAD is not tagged. Tag first:"
          echo "  git tag -a v0.1.1 -m '...' && git push origin v0.1.1"
          exit 1
        fi
      - |
        GITHUB_TOKEN="$(gh auth token)"         HOMEBREW_TAP_GITHUB_TOKEN="$(gh auth token)"         goreleaser release --clean

  release:check:
    desc: 'Build every release target without publishing anything'
    cmds:
      - goreleaser release --snapshot --clean --skip=publish
      - ls -lh dist/*.tar.gz dist/checksums.txt

  clean:
    desc: Remove build output
    cmds:
      - rm -rf "{{.EXT}}/dist" "{{.EXT}}/test-results" "{{.EXT}}/playwright-report"
      - rm -rf "{{.TASKFILE_DIR}}/dist"
      - rm -f "{{.AISS}}"

  reset:
    desc: Delete the server's database, config and logs — everything it stores
    prompt: This deletes your chats, notes, folders and pairings. Continue?
    cmds:
      - "{{.AISS}} reset --yes"
