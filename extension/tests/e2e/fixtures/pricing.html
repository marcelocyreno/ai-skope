<!doctype html>
<html>
  <head>
    <title>Northwind Analytics — Pricing</title>
    <style>
      body { font-family: system-ui; margin: 40px; }
      .pg-tiers { display: flex; gap: 16px; }
      .pg-tier { border: 1px solid #ddd; padding: 20px; width: 220px; }
    </style>
  </head>
  <body>
    <h1>Plans that scale with your event volume</h1>
    <p class="pg-lede">Every plan includes unlimited seats and 13 months of history.</p>
    <section class="pg-tiers">
      <article class="pg-tier">
        <h2>Starter</h2>
        <p>$0 / month</p>
      </article>
      <article class="pg-tier featured">
        <h2>Growth</h2>
        <p>$149 / month, capped at 25M events</p>
      </article>
      <article class="pg-tier">
        <h2>Enterprise</h2>
        <p>Custom</p>
      </article>
    </section>
  </body>
</html>
