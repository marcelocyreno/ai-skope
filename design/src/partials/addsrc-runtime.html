<div class="sk-form" data-view="runtime" hidden>
  <div class="sk-callout"><svg class="sk-ico" aria-hidden="true"><use href="#i-server"/></svg><span>The server looks for coding agents installed on this computer. Enable one and its models appear in the switcher.</span></div>
  <div>
    <div class="sk-rt"><span class="glyph"><svg class="sk-ico" aria-hidden="true"><use href="#r-claude-code"/></svg></span><div><b>Claude Code</b><small><span class="sk-dot"></span>2.1 · /opt/homebrew/bin/claude</small></div><button type="button" class="sk-switch" role="switch" aria-checked="true" aria-label="Claude Code"></button></div>
    <div class="sk-rt"><span class="glyph"><svg class="sk-ico" aria-hidden="true"><use href="#r-codex"/></svg></span><div><b>Codex</b><small><span class="sk-dot"></span>0.9 · ~/.npm/bin/codex</small></div><button type="button" class="sk-switch" role="switch" aria-checked="true" aria-label="Codex"></button></div>
    <div class="sk-rt"><span class="glyph"><svg class="sk-ico" aria-hidden="true"><use href="#r-pi"/></svg></span><div><b>pi</b><small><span class="sk-dot"></span>0.14 · ~/.local/bin/pi</small></div><button type="button" class="sk-switch" role="switch" aria-checked="true" aria-label="pi"></button></div>
    <div class="sk-rt"><span class="glyph"><svg class="sk-ico" aria-hidden="true"><use href="#r-omp"/></svg></span><div><b>omp</b><small><span class="sk-dot is-offline"></span>not found on PATH</small></div><button type="button" class="sk-btn secondary sm">Install guide</button></div>
    <div class="sk-rt"><span class="glyph"><svg class="sk-ico" aria-hidden="true"><use href="#r-opencode"/></svg></span><div><b>opencode</b><small><span class="sk-dot"></span>1.2 · /opt/homebrew/bin/opencode</small></div><button type="button" class="sk-switch" role="switch" aria-checked="true" aria-label="opencode"></button></div>
  </div>
  <label class="lbl">Custom command<input class="sk-input mono" type="text" placeholder="my-agent --stdio" aria-label="Custom command"></label>
</div>
