<div class="stage-var"><div class="stage-lbl">Buttons</div>
<div class="stage-row">
  <button class="sk-btn primary">Save note</button>
  <button class="sk-btn secondary">Edit key</button>
  <button class="sk-btn ghost"><svg class="sk-ico" aria-hidden="true"><use href="#i-plus"/></svg>Add provider</button>
  <button class="sk-btn aim"><svg class="sk-ico" aria-hidden="true"><use href="#i-reticle"/></svg>Pick element</button>
  <button class="sk-btn danger">Clear all data</button>
  <button class="sk-btn primary" disabled>Disabled</button>
</div></div>
<div class="stage-var"><div class="stage-lbl">Small</div>
<div class="stage-row">
  <button class="sk-btn primary sm">Save note</button>
  <button class="sk-btn secondary sm">2 sites</button>
  <button class="sk-btn ghost sm">Retry</button>
</div></div>
<div class="stage-var"><div class="stage-lbl">Icon buttons · default / hover / pressed (aim)</div>
<div class="stage-row">
  <button class="sk-iconbtn" aria-label="Settings"><svg class="sk-ico" aria-hidden="true"><use href="#i-gear"/></svg></button>
  <button class="sk-iconbtn" style="background:var(--surface-2);color:var(--ink)" aria-label="Attach"><svg class="sk-ico" aria-hidden="true"><use href="#i-paperclip"/></svg></button>
  <button class="sk-iconbtn" aria-pressed="true" aria-label="Pick element"><svg class="sk-ico" aria-hidden="true"><use href="#i-reticle"/></svg></button>
  <button class="sk-iconbtn" aria-pressed="true" aria-label="Select text"><svg class="sk-ico" aria-hidden="true"><use href="#i-select-text"/></svg></button>
  <button class="sk-send" aria-label="Send"><svg class="sk-ico" aria-hidden="true"><use href="#i-send"/></svg></button>
  <button class="sk-send" disabled aria-label="Send"><svg class="sk-ico" aria-hidden="true"><use href="#i-send"/></svg></button>
</div></div>
<div class="stage-var"><div class="stage-lbl">Segmented · switch · inputs</div>
<div class="stage-row">
  <div class="sk-seg"><button aria-pressed="false"><svg class="sk-ico" aria-hidden="true"><use href="#i-sun"/></svg>Light</button><button aria-pressed="true"><svg class="sk-ico" aria-hidden="true"><use href="#i-moon"/></svg>Dark</button><button aria-pressed="false"><svg class="sk-ico" aria-hidden="true"><use href="#i-monitor"/></svg>System</button></div>
  <button class="sk-switch" role="switch" aria-checked="true" aria-label="On"></button>
  <button class="sk-switch" role="switch" aria-checked="false" aria-label="Off"></button>
  <input class="sk-input mono" value="400 px" style="width:88px;text-align:right" aria-label="Width">
  <span class="sk-selectwrap"><select class="sk-select" aria-label="Default model"><option>Opus 5</option></select><svg class="sk-ico" aria-hidden="true"><use href="#i-chevron-down"/></svg></span>
</div></div>
